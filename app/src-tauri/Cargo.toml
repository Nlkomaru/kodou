[package]
name = "kodou"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kodou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
btleplug = "0.11"
futures = "0.3"
rosc = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync", "time"] }
uuid = "1"
# 心拍データの保存はピュアRustのParquet/Arrowで行い、HDF5のようなネイティブCライブラリ依存を避ける。
arrow-array = "54"
arrow-schema = "54"
# 記録中は追記耐性のあるArrow IPC stream形式で書き、正常終了時にParquetへ変換する。
# stream形式はfooterを末尾に持たないため、クラッシュで切れても完全なバッチは読み戻せる。
arrow-ipc = "54"
parquet = { version = "54", default-features = false, features = ["arrow", "snap"] }
# OSC送信先などユーザーが編集する設定をHOCON形式で読み込む。
hocon-parser = { version = "1", features = ["serde"] }
# 記録ファイル名を「年月/年月日_連番」にするため、ローカル時刻の日付を使う。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
