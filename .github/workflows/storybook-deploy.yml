name: Deploy Storybook

# app/ 配下の Storybook をビルドして Cloudflare (kodou-sb.vrc.nikomaru.dev) に配置する。
# main に push されたら自動で、任意のタイミングなら workflow_dispatch で手動実行できる。
on:
  push:
    branches:
      - main
    paths:
      - app/.storybook/**
      - app/src/**
      - app/package.json
      - app/wrangler.jsonc
      - pnpm-lock.yaml
      - .github/workflows/storybook-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        # 成果物は app/storybook-static に出力される (wrangler.jsonc で同じディレクトリを指している)。
        run: pnpm --dir app build-storybook

      # CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN は BSM(nikomaru プロジェクト、shared/CLOUDFLARE_ACCOUNT_ID・shared/CLOUDFLARE_API_TOKEN)管理に移行済み。
      # sm-action が GITHUB_ENV に書き込むため、以降のステップでは process.env 経由で自動的に参照できる。
      - name: Get secrets from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.NIKOMARU_BITWARDEN_SECRET_MANAGER_ACCESS_TOKEN }}
          secrets: |
            2bad9e23-82af-4fba-b514-b49900e1632f > CLOUDFLARE_ACCOUNT_ID
            f1bf4fa4-0288-4a31-b28b-b499013acdce > CLOUDFLARE_API_TOKEN

      - name: Deploy to Cloudflare
        # wrangler.jsonc の routes で kodou-sb.vrc.nikomaru.dev を custom_domain として指定済み。
        # 初回実行時に DNS レコードとカスタムドメインが作成されるため、
        # 利用アカウントが vrc.nikomaru.dev ゾーンをホストしている必要がある。
        # CLOUDFLARE_API_TOKEN は上の sm-action で GITHUB_ENV に書き込まれているため、wrangler が自動で読み取る。
        run: pnpm --dir app exec wrangler deploy