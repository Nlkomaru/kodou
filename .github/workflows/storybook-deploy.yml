name: Deploy Storybook

# app/ 配下の Storybook をビルドして Cloudflare (kodou-sb.vrc.nikomaru.dev) に配置する。
# main に push されたら自動で、任意のタイミングなら workflow_dispatch で手動実行できる。
on:
  push:
    branches:
      - main
    paths:
      - app/.storybook/**
      - app/src/**
      - app/scripts/prepare-storybook-cf.mjs
      - app/package.json
      - pnpm-lock.yaml
      - .github/workflows/storybook-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: storybook-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vp
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true

      - name: Build Storybook
        # 成果物は app/storybook-static に出力される。
        run: pnpm --dir app build-storybook

      - name: Prepare Cloudflare output
        run: node app/scripts/prepare-storybook-cf.mjs

      - name: Load Production Secrets
        uses: nlkomaru/secret-manager@v2
        with:
          project: "kodou"
          env: "production"
          shared-keys: CLOUDFLARE_ACCOUNT_ID

      - name: Deploy to Cloudflare
        # kodou-sb.vrc.nikomaru.dev をカスタムドメインとして指定済み。
        # 初回実行時に DNS レコードとカスタムドメインが作成されるため、
        # 利用アカウントが vrc.nikomaru.dev ゾーンをホストしている必要がある。
        run: pnpm --dir app exec cf deploy --prebuilt